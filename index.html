<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Veucact — Commission Skin Minecraft</title>

    <!-- Menghubungkan file CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- HEADER -->
        <header>
            <img src="profile.jpg" alt="Profil Veucact" class="header-profile">
            <div class="header-name">veucact</div>
        </header>

        <!-- PROFIL UTAMA -->
        <section class="hero">
            <img src="profile.jpg" alt="Logo Veucact" class="main-profile">

            <h1>veucact</h1>
            <h2>Commission</h2>
            <p>Skin Minecraft</p>
        </section>

        <!-- DAFTAR PRODUK -->
        <section class="products">

            <!-- PRODUK 1 -->
            <article class="product-card">
                <img src="product1.jpg" alt="Custom Skin" class="product-image">

                <h3>Custom Skin</h3>
                <p>Skin sesuai keinginanmu.</p>

                <a href="#" class="order-button">Order</a>
            </article>

            <!-- PRODUK 2 -->
            <article class="product-card">
                <img src="product2.jpg" alt="Full Body" class="product-image">

                <h3>Full Body</h3>
                <p>Desain karakter custom.</p>

                <a href="#" class="order-button">Order</a>
            </article>

            <!-- PRODUK 3 -->
            <article class="product-card">
                <img src="product3.jpg" alt="Couple Skin" class="product-image">

                <h3>Couple Skin</h3>
                <p>Skin Minecraft pasangan.</p>

                <a href="#" class="order-button">Order</a>
            </article>

        </section>

        <!-- FOOTER -->
        <footer>
            &copy; 2026 Veucact — Commission Skin Minecraft
        </footer>

    </div>

</body>
  </html>
