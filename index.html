<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Veucact — Commission Skin Minecraft</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- HEADER -->
        <header>
            <img src="profil.png" alt="Profil Veucact" class="header-profile">
            <div class="header-name">veucact</div>
        </header>

        <!-- PROFIL UTAMA -->
        <section class="hero">

            <img src="profil.png" alt="Logo Veucact" class="main-profile">

            <h1>veucact</h1>
            <h2>Commission</h2>
            <p>Skin Minecraft</p>

        </section>

        <!-- DAFTAR PRODUK -->
        <section class="products">

            <!-- COUPLE -->
            <article class="product-card">

                <img
                    src="product1.jpg"
                    alt="Couple Skin"
                    class="product-image"
                >

                <h3>Couple</h3>

                <p>Skin couple</p>

                <div class="product-price">Rp30.000</div>

                <a
                    href="https://wa.me/6285188258937?text=Halo%20Veucact%2C%20saya%20ingin%20order%20Couple%20Skin%20seharga%20Rp30.000."
                    class="order-button"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    Order
                </a>

            </article>

            <!-- FULL BODY -->
            <article class="product-card">

                <img
                    src="product2.jpg"
                    alt="Full Body Skin"
                    class="product-image"
                >

                <h3>Full Body</h3>

                <p>Skin fullbody</p>

                <div class="product-price">Rp20.000</div>

                <a
                    href="https://wa.me/6285188258937?text=Halo%20Veucact%2C%20saya%20ingin%20order%20Full%20Body%20seharga%20Rp20.000."
                    class="order-button"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    Order
                </a>

            </article>

            <!-- OUTFIT -->
            <article class="product-card">

                <img
                    src="product3.jpg"
                    alt="Outfit Skin"
                    class="product-image"
                >

                <h3>Outfit</h3>

                <p>Skin outfit</p>

                <div class="product-price">Rp10.000</div>

                <a
                    href="https://wa.me/6285188258937?text=Halo%20Veucact%2C%20saya%20ingin%20order%20Outfit%20Skin%20seharga%20Rp10.000."
                    class="order-button"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    Order
                </a>

            </article>

        </section>

        <!-- FOOTER -->
        <footer>
            &copy; 2026 Veucact — Commission Skin Minecraft
        </footer>

    </div>

</body>
</html>
